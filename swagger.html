<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReelSnap API Documentation - Swagger UI</title>
    <link rel="icon" type="image/png" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.11.0/favicon-32x32.png" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.11.0/swagger-ui.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background: #0f1117;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f1f5f9;
        }
        .custom-nav {
            background: #181b26;
            border-bottom: 1px solid #2a2f42;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            font-size: 1.15rem;
        }
        .brand-badge {
            background: linear-gradient(135deg, #e50914, #ff334b);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            font-weight: 800;
        }
        .nav-links {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .nav-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .nav-btn:hover {
            background: #e50914;
            color: #fff;
            border-color: #e50914;
        }
        /* Customizing Swagger UI for Dark Mode compatibility */
        .swagger-ui {
            font-family: inherit;
        }
        .swagger-ui .topbar {
            display: none !important;
        }
        .swagger-ui .info {
            margin: 25px 0 20px 0;
        }
        .swagger-ui .info .title {
            color: #f8fafc;
            font-family: inherit;
        }
        .swagger-ui .info p, .swagger-ui .info li {
            color: #cbd5e1;
        }
        .swagger-ui .scheme-container {
            background: #181b26;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 25px;
        }
        .swagger-ui select {
            background-color: #242938;
            color: #f8fafc;
            border: 1px solid #3b425b;
            border-radius: 6px;
            padding: 6px 12px;
        }
        .swagger-ui .opblock-tag {
            color: #f1f5f9;
            border-bottom: 1px solid #2a2f42;
        }
        .swagger-ui .opblock-tag small {
            color: #94a3b8;
        }
        .swagger-ui .opblock {
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            margin: 0 0 16px 0;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .swagger-ui .opblock .opblock-summary {
            padding: 10px 16px;
        }
        .swagger-ui .opblock .opblock-summary-method {
            border-radius: 6px;
            font-weight: 700;
        }
        .swagger-ui .opblock-description-wrapper p,
        .swagger-ui .response-col_status,
        .swagger-ui table thead tr th,
        .swagger-ui table thead tr td,
        .swagger-ui .parameter__name,
        .swagger-ui .parameter__type {
            color: #cbd5e1;
        }
        .swagger-ui .btn.authorize {
            color: #22c55e;
            border-color: #22c55e;
            background: transparent;
        }
        .swagger-ui .btn.authorize svg {
            fill: #22c55e;
        }
        #swagger-ui {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 20px 60px 20px;
        }
    </style>
</head>
<body>
    <header class="custom-nav">
        <a href="/" class="brand">
            <span class="brand-badge">API DOCS</span>
            <span>ReelSnap Short Drama Swagger</span>
        </a>
        <div class="nav-links">
            <a href="/swagger.json" target="_blank" class="nav-btn">
                <span>📄 Raw JSON</span>
            </a>
            <a href="/" class="nav-btn">
                <span>🎬 Mở Web Player</span>
            </a>
        </div>
    </header>

    <div id="swagger-ui"></div>

    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            window.ui = SwaggerUIBundle({
                url: "/swagger.json",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "BaseLayout",
                docExpansion: "list",
                filter: true,
                persistAuthorization: true,
                defaultModelsExpandDepth: 2,
                displayRequestDuration: true
            });
        };
    </script>
</body>
</html>
